name: Test binary rename after installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install aws-nuke with rename
        id: install
        uses: .
        with:
          binary: aws-nuke
          version: "v2.25.0"
          download_url: "https://github.com/rebuy-de/aws-nuke/releases/download/${version}/aws-nuke-${version}-linux-amd64.tar.gz"
          tarball_binary_path: "aws-nuke-${version}-linux-amd64"
          smoke_test: "${binary} version"
          binary_new_name: "aws-nuke"

      - name: Assert renamed binary is on PATH
        run: |
          echo "Checking aws-nuke is on PATH..."
          if ! which aws-nuke; then
            echo "FAIL: aws-nuke not found on PATH"
            exit 1
          fi
          echo "Running aws-nuke version..."
          if ! aws-nuke version; then
            echo "FAIL: aws-nuke version failed"
            exit 1
          fi
          echo "PASS: binary renamed and installed as aws-nuke"
