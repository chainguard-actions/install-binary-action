name: Test binary installation caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install vendir (first time)
        id: install-first
        uses: .
        with:
          binary: vendir
          version: "0.40.2"
          download_url: "https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Assert vendir installed (first time)
        run: |
          echo "Checking vendir is on PATH after first install..."
          if ! which vendir; then
            echo "FAIL: vendir not found on PATH"
            exit 1
          fi
          if ! vendir --version; then
            echo "FAIL: vendir --version failed"
            exit 1
          fi
          echo "PASS: vendir installed (first time)"

      - name: Install vendir (second time - should use cache)
        id: install-second
        uses: .
        with:
          binary: vendir
          version: "0.40.2"
          download_url: "https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Assert vendir still works after second install (cache hit)
        run: |
          echo "Checking vendir is on PATH after second install (cache)..."
          if ! which vendir; then
            echo "FAIL: vendir not found on PATH after cache install"
            exit 1
          fi
          if ! vendir --version; then
            echo "FAIL: vendir --version failed after cache install"
            exit 1
          fi
          echo "PASS: vendir works after cached install"
