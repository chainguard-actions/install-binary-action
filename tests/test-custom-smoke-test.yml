name: Test custom smoke test command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install helm-docs with custom smoke test
        id: install
        uses: .
        with:
          binary: helm-docs
          version: "1.14.2"
          download_url: "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz"
          tarball_binary_path: "${binary}"
          smoke_test: "${binary} --version"

      - name: Assert helm-docs is installed and custom smoke test passed
        run: |
          echo "Checking helm-docs is on PATH..."
          if ! which helm-docs; then
            echo "FAIL: helm-docs not found on PATH"
            exit 1
          fi
          echo "Running helm-docs --version..."
          if ! helm-docs --version; then
            echo "FAIL: helm-docs --version failed"
            exit 1
          fi
          echo "PASS: helm-docs installed with custom smoke test"
