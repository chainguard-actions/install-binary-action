name: Test plain binary installation (no tarball)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq as a plain binary (no archive extension)
        id: action
        uses: .
        continue-on-error: true
        with:
          binary: jq
          version: "1.7.1"
          download_url: "https://github.com/jqlang/jq/releases/download/jq-${version}/jq-linux-amd64"
          smoke_test: "jq --version"

      - name: Assert jq is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking jq is on PATH..."
            if ! command -v jq > /dev/null 2>&1; then
              echo "FAIL: jq not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: jq found at $(command -v jq)"
            OUTPUT=$(jq --version 2>&1)
            echo "Output: $OUTPUT"
            if echo "$OUTPUT" | grep -q "1.7.1"; then
              echo "PASS: correct version installed"
            else
              echo "FAIL: expected version 1.7.1 in output, got: $OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (node24 runtime may not be supported by act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
