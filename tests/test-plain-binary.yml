name: Test plain binary installation (no tarball)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install vendir plain binary
        id: install
        uses: .
        with:
          binary: vendir
          version: "0.40.2"
          download_url: "https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Assert vendir is installed and executable
        run: |
          echo "Checking vendir is on PATH..."
          if ! which vendir; then
            echo "FAIL: vendir not found on PATH"
            exit 1
          fi
          echo "Running vendir --version..."
          if ! vendir --version; then
            echo "FAIL: vendir --version failed"
            exit 1
          fi
          echo "PASS: vendir plain binary installed successfully"
