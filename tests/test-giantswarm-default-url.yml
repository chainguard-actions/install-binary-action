name: Test giantswarm default URL template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install devctl using default giantswarm URL template
        id: install_devctl
        uses: .
        with:
          binary: devctl
          version: "7.2.6"
          smoke_test: "${binary} version"

      - name: Assert devctl is installed and executable
        run: |
          echo "Checking devctl is on PATH..."
          which devctl || { echo "FAIL: devctl not found on PATH"; exit 1; }
          echo "Running devctl version..."
          devctl version || { echo "FAIL: devctl version failed"; exit 1; }
          echo "PASS: devctl installed via default giantswarm URL template"
