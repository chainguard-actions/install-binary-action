name: Test basic binary installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install semver using custom download URL and tarball path
        id: install_semver
        uses: .
        with:
          binary: semver
          version: "3.0.0"
          download_url: "https://github.com/fsaintjacques/${binary}-tool/archive/${version}.tar.gz"
          tarball_binary_path: "*/src/${binary}"
          smoke_test: "${binary} --version"

      - name: Assert semver is installed and executable
        run: |
          echo "Checking semver is on PATH..."
          which semver || { echo "FAIL: semver not found on PATH"; exit 1; }
          echo "Running semver --version..."
          semver --version || { echo "FAIL: semver --version failed"; exit 1; }
          echo "PASS: semver installed successfully"
