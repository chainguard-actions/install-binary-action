name: Test basic binary installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install devctl binary (default URL template)
        uses: .
        with:
          binary: devctl
          version: "7.2.6"

      - name: Assert binary is installed and executable
        run: |
          echo "Checking devctl is on PATH..."
          which devctl || { echo "FAIL: devctl not found on PATH"; exit 1; }
          echo "Running devctl version..."
          devctl version || { echo "FAIL: devctl version failed"; exit 1; }
          echo "PASS: devctl installed successfully"
