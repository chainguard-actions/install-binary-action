name: Test basic binary installation (tarball)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install helm via tarball
        id: install
        uses: .
        with:
          binary: helm
          version: "3.17.3"
          download_url: "https://get.helm.sh/helm-v${version}-linux-amd64.tar.gz"
          tarball_binary_path: "*/helm"
          smoke_test: "helm version"

      - name: Assert binary is installed and executable
        run: |
          echo "Checking helm is on PATH..."
          if ! which helm; then
            echo "FAIL: helm not found on PATH"
            exit 1
          fi
          echo "Running helm version..."
          if ! helm version; then
            echo "FAIL: helm version failed"
            exit 1
          fi
          echo "PASS: helm installed successfully"
